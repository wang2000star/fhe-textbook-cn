name: Publish verified PDFs once

on:
  push:
    branches: [publish-pdfs-20261110]
    paths:
      - .github/workflows/publish-pdfs-once.yml
      - .github/pdf-upload/**

concurrency:
  group: publish-verified-pdfs-20261110
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'wang2000star/fhe-textbook-cn' && github.ref == 'refs/heads/publish-pdfs-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      PDF_SOURCE_COMMIT: 92900a4923efd2a1c984f0365eef5650d2010ac2
    steps:
      - name: Check out the upload preparation commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The temporary branch must descend from the target's source commit.
          fetch-depth: 0
          persist-credentials: true

      - name: Verify the successful source run and its artifacts
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const runId = 42675134457;
            const { data: run } = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: runId,
            });
            if (run.status !== 'completed' || run.conclusion !== 'success' ||
                run.head_branch !== 'chinese-edition' ||
                run.head_sha !== process.env.PDF_SOURCE_COMMIT) {
              throw new Error('The textbook workflow run does not match the verified source.');
            }
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: runId,
              per_page: 100,
            });
            const expected = [
              [13700880661, 'fhe-textbook-en'],
              [13700266478, 'fhe-textbook-zh'],
            ];
            for (const [id, name] of expected) {
              const artifact = data.artifacts.find(item => item.id === id);
              if (!artifact || artifact.name !== name || artifact.expired !== false) {
                throw new Error(`Missing, expired, or mismatched artifact: ${name} (${id}).`);
              }
            }

      - name: Download the verified English textbook
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13700880661'
          run-id: '42675134457'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: build/published-en
          merge-multiple: true

      - name: Download the verified Chinese textbook
        uses: actions/download-artifact@v4
        with:
          artifact-ids: '13700266478'
          run-id: '42675134457'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: build/published-zh
          merge-multiple: true

      - name: Verify and assemble the three PDFs and their documentation
        run: python3 .github/pdf-upload/assemble.py

      - name: Publish to the unchanged source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/chinese-edition
          pdf_target_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$pdf_target_head" != "$PDF_SOURCE_COMMIT" ]]; then
            echo "::error::chinese-edition has moved from the verified source; publication aborted."
            exit 1
          fi
          git merge-base --is-ancestor "$PDF_SOURCE_COMMIT" HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r -- .github/pdf-upload
          git rm -- .github/workflows/publish-pdfs-once.yml
          git add -- \
            pdf/fhe-textbook-en.pdf \
            pdf/fhe-textbook-zh.pdf \
            pdf/fhe-textbook-academic-review.pdf \
            pdf/manifest.json \
            pdf/README.md \
            README.md \
            audit/validation.json
          git diff --cached --check
          git commit -m 'Publish verified textbook and academic review PDFs [skip ci]'
          # A concurrent branch advance is rejected by this ordinary push.
          git push origin HEAD:refs/heads/chinese-edition

      - name: Remove the temporary upload branch after publication
        shell: bash
        run: |
          set -euo pipefail
          if ! pdf_temporary_ref="$(git ls-remote --heads origin refs/heads/publish-pdfs-20261110)"; then
            echo '::warning::PDFs were published, but the temporary branch could not be inspected.'
            exit 0
          fi
          pdf_temporary_head="${pdf_temporary_ref%%$'\t'*}"
          if [[ -z "$pdf_temporary_head" ]]; then
            exit 0
          fi
          if [[ "$pdf_temporary_head" != "$GITHUB_SHA" ]]; then
            echo '::warning::PDFs were published; the temporary branch has changed and was retained.'
            exit 0
          fi
          if ! git push --force-with-lease="refs/heads/publish-pdfs-20261110:$GITHUB_SHA" \
              origin :refs/heads/publish-pdfs-20261110; then
            echo '::warning::PDFs were published, but deleting the temporary upload branch failed.'
          fi
